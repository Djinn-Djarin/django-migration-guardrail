[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-migrations-guardrail"
version = "0.1.1"
description = "Django migration checker and schema drift guardrail for safer database deploys."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "django",
    "django migrations",
    "migration checker",
    "schema drift",
    "database schema",
    "deployment safety",
    "management command",
]
dependencies = [
    "django>=4.1",
]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]

license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/Djinn-Djarin/django-migration-guardrail"
Repository = "https://github.com/Djinn-Djarin/django-migration-guardrail"
Issues = "https://github.com/Djinn-Djarin/django-migration-guardrail/issues"

[tool.setuptools.packages.find]
include = ["migration_guardrail*"]
